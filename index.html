<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rally Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0B0F0E; color: #E8ECE9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  .display { font-weight: 700; letter-spacing: 0.04em; }
  input::placeholder { color: #4A5450; }
  input, button { font-family: inherit; }
  @keyframes pulseRed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(225,89,79,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(225,89,79,0); }
  }
  @keyframes pulseAmber {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242,169,59,0.45); }
    50% { box-shadow: 0 0 0 8px rgba(242,169,59,0); }
  }
  .imminent { animation: pulseRed 1.2s infinite; }
  .imminent-start { animation: pulseAmber 1.2s infinite; }
  .row { display: flex; align-items: center; }
  .btn { cursor: pointer; }
  .card {
    background: #121815; border: 1px solid #1D2523; border-radius: 8px; padding: 10px 12px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .sync-toggle {
    display: flex; align-items: center; gap: 6px; margin-top: 8px; background: none;
    border: none; color: #6B7570; cursor: pointer; font-size: 11.5px; padding: 4px 0 0;
  }
  .sync-grid { display: grid; column-gap: 8px; row-gap: 5px; }
  .adjbtn {
    background: #1D2523; border: 1px solid #2A3330; border-radius: 4px; color: #8A948F;
    cursor: pointer; font-size: 10px; font-weight: 700; min-width: 26px; height: 18px; line-height: 1; padding: 0 3px;
  }
  .field {
    background: #121815; border: 1px solid #1D2523; border-radius: 6px; padding: 8px 10px;
    color: #E8ECE9; font-size: 13px; outline: none;
  }
  .field.dark { background: #0B0F0E; border-color: #2A3330; padding: 6px 8px; }
  .pill {
    background: #1D2523; border: 1px solid #2A3330; border-radius: 14px; color: #8A948F;
    cursor: pointer; font-size: 11px; font-weight: 600; padding: 5px 12px;
  }
  .pill.active { background: #3FD6C7; color: #0B0F0E; border-color: #3FD6C7; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const RALLY_BUFFER = 5 * 60;
const TEAM_META = {
  ally: { label: "OUR STATE", accent: "#3FD6C7", icon: "🛡️" },
  enemy: { label: "ENEMY STATE", accent: "#E1594F", icon: "⚔️" },
};

// ---- storage ----
function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem("rallytracker:" + key);
    return v === null ? fallback : JSON.parse(v);
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem("rallytracker:" + key, JSON.stringify(value)); } catch (e) {}
}

// ---- state ----
let roster = loadJSON("roster", []).map(p => ({
  ...p,
  alliance: (p.alliance || "").trim() || "Unassigned"
}));
let rallies = loadJSON("rallies", []).map(r => ({
  ...r,
  startAt: r.startAt != null ? r.startAt : r.startTime
}));
let groups = loadJSON("groups", []).map(g => ({
  mode: "now", targetTime: "", launchDelay: 0, memberIds: [], ...g
}));

let draft = {
  ally: { name: "", march: "", alliance: "" },
  enemy: { name: "", march: "", alliance: "" }
};
let editDraft = null;
let pendingDelete = null;
let expanded = {};
let groupEditor = null;

let idCounter = 1 + Math.max(
  0,
  ...roster.map(p => p.id),
  ...rallies.map(r => r.id),
  ...groups.map(g => g.id)
);
function nextId() { return idCounter++; }

function persist() {
  saveJSON("roster", roster);
  saveJSON("rallies", rallies);
  saveJSON("groups", groups);
}

// ---- helpers ----
function fmtMMSS(totalSeconds) {
  const sign = totalSeconds < 0 ? "-" : "";
  const t = Math.abs(Math.round(totalSeconds));
  const m = Math.floor(t / 60);
  const s = t % 60;
  return sign + m + ":" + String(s).padStart(2, "0");
}
function fmtClockUTC(date) {
  return date.toLocaleTimeString("en-GB", {
    timeZone: "UTC",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}
function esc(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
function groupNameById(id) {
  const g = groups.find(x => x.id === id);
  return g ? g.name : "Sync Group";
}
function parseMarchInput(str) {
  str = (str || "").trim();
  if (!str) return NaN;
  if (str.includes(":")) {
    const parts = str.split(":");
    if (parts.length !== 2) return NaN;
    const m = parseInt(parts[0], 10);
    const s = parseInt(parts[1], 10);
    if (isNaN(m) || isNaN(s) || s < 0 || s > 59 || m < 0) return NaN;
    return m * 60 + s;
  }
  const n = parseInt(str, 10);
  return isNaN(n) ? NaN : n;
}
function parseUTCTimeToday(str) {
  str = (str || "").trim();
  const m = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (!m) return null;
  const hh = parseInt(m[1], 10), mm = parseInt(m[2], 10), ss = m[3] ? parseInt(m[3], 10) : 0;
  if (hh > 23 || mm > 59 || ss > 59) return null;
  const now = new Date();
  let target = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), hh, mm, ss);
  if (target <= Date.now()) target += 24 * 60 * 60 * 1000;
  return target;
}

// ---- actions: roster ----
function addPerson(team) {
  const name = draft[team].name.trim();
  const seconds = parseMarchInput(draft[team].march);
  if (!name || !seconds || seconds <= 0) return;
  const alliance = (draft[team].alliance || "").trim() || "Unassigned";
  roster.push({ id: nextId(), name, team, alliance, marchTime: seconds });
  draft[team].name = "";
  draft[team].march = "";
  draft[team].alliance = "";
  persist();
  render();
}
function startEdit(id) {
  const p = roster.find(x => x.id === id);
  if (!p) return;
  editDraft = { id, name: p.name, march: String(p.marchTime), alliance: p.alliance };
  render();
}
function onEditInput(el, field) {
  if (!editDraft) return;
  editDraft[field] = el.value;
}
function cancelEdit() {
  editDraft = null;
  render();
}
function saveEdit() {
  if (!editDraft) return;
  const name = editDraft.name.trim();
  const seconds = parseMarchInput(editDraft.march);
  if (!name || !seconds || seconds <= 0) return;
  const alliance = (editDraft.alliance || "").trim() || "Unassigned";
  const p = roster.find(x => x.id === editDraft.id);
  if (p) {
    p.name = name;
    p.marchTime = seconds;
    p.alliance = alliance;
  }
  editDraft = null;
  persist();
  render();
}
function handleEditKey(e) {
  if (e.key === "Enter") saveEdit();
  if (e.key === "Escape") cancelEdit();
}

// ---- actions: delete confirmation ----
function requestDelete(type, id) {
  if (type === "person") {
    const p = roster.find(x => x.id === id);
    if (!p) return;
    pendingDelete = { type, id, label: `${p.name} from the roster` };
  } else if (type === "rally") {
    const r = rallies.find(x => x.id === id);
    if (!r) return;
    pendingDelete = { type, id, label: `the rally for ${r.name}` };
  } else if (type === "group") {
    const g = groups.find(x => x.id === id);
    if (!g) return;
    pendingDelete = { type, id, label: `the sync group "${g.name}"` };
  } else if (type === "groupLaunch") {
    const g = groups.find(x => x.id === id);
    const count = rallies.filter(r => r.groupId === id).length;
    if (!count) return;
    pendingDelete = { type, id, label: `${count} launched ${count === 1 ? "rally" : "rallies"} from "${g ? g.name : "this group"}"` };
  }
  render();
}
function cancelDelete() {
  pendingDelete = null;
  render();
}
function confirmDelete() {
  if (!pendingDelete) return;
  if (pendingDelete.type === "person") {
    roster = roster.filter(p => p.id !== pendingDelete.id);
  } else if (pendingDelete.type === "rally") {
    rallies = rallies.filter(r => r.id !== pendingDelete.id);
    delete expanded[pendingDelete.id];
  } else if (pendingDelete.type === "group") {
    groups = groups.filter(g => g.id !== pendingDelete.id);
  } else if (pendingDelete.type === "groupLaunch") {
    rallies.filter(r => r.groupId === pendingDelete.id).forEach(r => delete expanded[r.id]);
    rallies = rallies.filter(r => r.groupId !== pendingDelete.id);
  }
  pendingDelete = null;
  persist();
  render();
}

// ---- actions: rallies ----
function startRally(personId) {
  const person = roster.find(p => p.id === personId);
  if (!person) return;
  const startAt = Date.now();
  const hitTime = startAt + (RALLY_BUFFER + person.marchTime) * 1000;
  rallies.push({
    id: nextId(), personId: person.id, name: person.name, team: person.team,
    alliance: person.alliance || "Unassigned", marchTime: person.marchTime,
    startAt, hitTime
  });
  persist();
  render();
}
function startScheduledNow(id) {
  const r = rallies.find(x => x.id === id);
  if (!r) return;
  r.startAt = Date.now();
  r.hitTime = r.startAt + (RALLY_BUFFER + r.marchTime) * 1000;
  persist();
  render();
}
function adjustRally(id, delta) {
  const r = rallies.find(x => x.id === id);
  if (!r) return;
  const now = Date.now();
  r.hitTime += delta * 1000;
  if (r.startAt && now < r.startAt) {
    r.startAt += delta * 1000;
  }
  persist();
  render();
}
function toggleExpanded(id) {
  expanded[id] = expanded[id] === false ? true : false;
  render();
}

function onDraftInput(el, team, field) {
  draft[team][field] = el.value;
}
function handleEnter(e, team) {
  if (e.key === "Enter") addPerson(team);
}

// ---- actions: sync groups ----
function openGroupEditor(id) {
  if (id == null) {
    groupEditor = { id: null, name: "", memberIds: [] };
  } else {
    const g = groups.find(x => x.id === id);
    if (!g) return;
    groupEditor = { id: g.id, name: g.name, memberIds: [...g.memberIds] };
  }
  render();
}
function cancelGroupEditor() {
  groupEditor = null;
  render();
}
function onGroupNameInput(el) {
  if (!groupEditor) return;
  groupEditor.name = el.value;
}
function toggleGroupMember(personId) {
  if (!groupEditor) return;
  const i = groupEditor.memberIds.indexOf(personId);
  if (i === -1) groupEditor.memberIds.push(personId);
  else groupEditor.memberIds.splice(i, 1);
  render();
}
function saveGroup() {
  if (!groupEditor) return;
  const name = groupEditor.name.trim() || `Sync Group ${groups.length + 1}`;
  if (groupEditor.memberIds.length < 2) return;
  if (groupEditor.id == null) {
    groups.push({ id: nextId(), name, memberIds: [...groupEditor.memberIds], mode: "now", targetTime: "", launchDelay: 0 });
  } else {
    const g = groups.find(x => x.id === groupEditor.id);
    if (g) { g.name = name; g.memberIds = [...groupEditor.memberIds]; }
  }
  groupEditor = null;
  persist();
  render();
}
function setGroupMode(id, mode) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  g.mode = mode;
  persist();
  render();
}
function onGroupTargetInput(el, id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  g.targetTime = el.value;
  persist();
}
function handleGroupTargetKey(e) {
  if (e.key === "Enter") { e.target.blur(); render(); }
}
function setGroupPreset(id, presetKey) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  const now = Date.now();
  if (g.mode === "now") {
    if (presetKey === "now") g.launchDelay = 0;
    else if (presetKey === "1m") g.launchDelay = 60;
    else if (presetKey === "5m") g.launchDelay = 300;
    else return;
    persist();
    render();
    return;
  }
  let target;
  if (presetKey === "6m") target = now + 6 * 60 * 1000;
  else if (presetKey === "10m") target = now + 10 * 60 * 1000;
  else return;
  g.mode = "target";
  g.targetTime = fmtClockUTC(new Date(target));
  persist();
  render();
}
function launchGroup(groupId) {
  const g = groups.find(x => x.id === groupId);
  if (!g) return;
  const members = roster.filter(p => g.memberIds.includes(p.id));
  if (members.length < 2) return;
  const totals = members.map(p => ({ ...p, total: RALLY_BUFFER + p.marchTime }));
  const now = Date.now();
  let hitTs;
  if (g.mode === "target") {
    hitTs = parseUTCTimeToday(g.targetTime);
    if (hitTs == null) return;
  } else {
    const maxTotal = Math.max(...totals.map(p => p.total));
    hitTs = now + ((Number(g.launchDelay) || 0) + maxTotal) * 1000;
  }
  totals.forEach(p => {
    const startAt = hitTs - p.total * 1000;
    rallies.push({
      id: nextId(),
      personId: p.id,
      name: p.name,
      team: p.team,
      alliance: p.alliance || "Unassigned",
      marchTime: p.marchTime,
      startAt,
      hitTime: hitTs,
      groupId: g.id
    });
  });
  persist();
  render();
}

// ---- render ----
function render() {
  const now = Date.now();
  rallies = rallies.filter(x => {
    const keep = now - x.hitTime < 2 * 60 * 1000;
    if (!keep) delete expanded[x.id];
    return keep;
  });
  const sortKey = r => (r.startAt && now < r.startAt) ? r.startAt : r.hitTime;
  const activeSorted = [...rallies].sort((a, b) => sortKey(a) - sortKey(b));

  let html = "";

  html += `
    <div class="row" style="border-bottom:1px solid #1D2523;padding:20px 16px;gap:10px;">
      <span style="font-size:20px;">📡</span>
      <div>
        <div class="display" style="font-size:22px;color:#F2A93B;line-height:1;">RALLY TRACKER</div>
        <div class="mono" style="font-size:11px;color:#6B7570;margin-top:2px;">Castle battle</div>
      </div>
    </div>`;

  html += `<div style="padding:16px;">
    <div class="display" style="font-size:14px;color:#8A948F;margin-bottom:10px;text-transform:uppercase;">Incoming (${activeSorted.length})</div>`;

  if (activeSorted.length === 0) {
    html += `<div style="padding:18px 14px;background:#121815;border:1px dashed #262E2B;border-radius:8px;color:#5A6560;font-size:13px;">No active rallies. Start one below.</div>`;
  }

  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  activeSorted.forEach(r => {
    const meta = TEAM_META[r.team];
    const isScheduled = r.startAt && now < r.startAt;
    r._wasScheduled = isScheduled;
    const elapsed = (now - r.startAt) / 1000;
    const rallyRemaining = RALLY_BUFFER - elapsed;
    const hitRemaining = (r.hitTime - now) / 1000;
    const hasHit = hitRemaining <= 0;
    const rallyDone = rallyRemaining <= 0;
    const imminent = !isScheduled && !hasHit && hitRemaining <= 10;
    const secsUntilStart = isScheduled ? (r.startAt - now) / 1000 : 0;
    const imminentStart = isScheduled && secsUntilStart <= 10;
    const isExpanded = expanded[r.id] !== false;

    // Get IDs of all people currently in Incoming
    const activePersonIds = new Set(rallies.map(x => x.personId));

    const others = roster
      .filter(p => !activePersonIds.has(p.id) && p.team === "ally")
      .map(p => {
        const startBy = r.hitTime - (RALLY_BUFFER + p.marchTime) * 1000;
        const followStartBy = r.hitTime - RALLY_BUFFER * 1000;
        return { ...p, startBy, secsUntilStart: (startBy - now) / 1000, followStartBy, secsUntilFollowStart: (followStartBy - now) / 1000 };
      })
      .sort((a, b) => a.startBy - b.startBy);
    const isEnemy = r.team === "enemy";

    html += `<div class="card js-rally-card ${imminent ? "imminent" : ""} ${imminentStart ? "imminent-start" : ""}"
      data-id="${r.id}"
      data-is-scheduled="${isScheduled}"
      data-start-at="${r.startAt}"
      data-hit-time="${r.hitTime}"
      style="border-color:${hasHit ? "#E1594F" : "#1D2523"};border-left:3px solid ${meta.accent};">
      <div class="row" style="justify-content:space-between;gap:10px;">
        <div style="min-width:0;">
          <div style="font-size:14px;font-weight:600;color:#E8ECE9;">${esc(r.name)} <span style="font-size:11px;color:${meta.accent};margin-left:6px;">${meta.label}</span>
            <span style="font-size:10px;color:#8A948F;margin-left:5px;">· ${esc(r.alliance || "Unassigned")}</span>
            ${r.groupId ? `<span style="font-size:10px;color:#3FD6C7;margin-left:5px;">· 🎯 ${esc(groupNameById(r.groupId))}</span>` : ""}
          </div>
          <div class="mono" style="font-size:11px;color:#6B7570;margin-top:2px;">${isScheduled ? `starts: UTC ${fmtClockUTC(new Date(r.startAt))} · ` : ""}hits: UTC ${fmtClockUTC(new Date(r.hitTime))}</div>
        </div>
        <div class="row" style="gap:10px;">`;

    if (isScheduled) {
      html += `
          <div style="text-align:right;">
            <div class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.06em;">STARTS IN</div>
            <div class="mono js-timer-starts-in" style="font-size:20px;font-weight:700;color:#F2A93B;min-width:60px;">${fmtMMSS(secsUntilStart)}</div>
          </div>
          <button class="btn" onclick="startScheduledNow(${r.id})" style="background:${meta.accent};color:#0B0F0E;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;">▶ Start now</button>`;
    } else {
      html += `
          <div style="text-align:right;">
            <div class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.06em;">RALLY</div>
            <div class="mono js-timer-rally" style="font-size:15px;font-weight:700;color:${rallyDone ? "#3E4A46" : "#8A948F"};">${rallyDone ? "0:00" : fmtMMSS(rallyRemaining)}</div>
          </div>
          <div style="text-align:right;">
            <div class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.06em;">HIT</div>
            <div class="mono js-timer-hit" style="font-size:20px;font-weight:700;color:${hasHit ? "#E1594F" : "#F2A93B"};min-width:60px;">${hasHit ? "HIT" : fmtMMSS(hitRemaining)}</div>
          </div>`;
    }

    html += `
          <div style="display:flex;flex-direction:column;gap:3px;">
            <div class="row" style="gap:3px;">
              <button class="adjbtn" onclick="adjustRally(${r.id},10)" title="Push hit time 10s later">+10</button>
              <button class="adjbtn" onclick="adjustRally(${r.id},1)" title="Push hit time 1s later">+1</button>
            </div>
            <div class="row" style="gap:3px;">
              <button class="adjbtn" onclick="adjustRally(${r.id},-1)" title="Pull hit time 1s earlier">-1</button>
              <button class="adjbtn" onclick="adjustRally(${r.id},-10)" title="Pull hit time 10s earlier">-10</button>
            </div>
          </div>
          <button class="btn" onclick="requestDelete('rally',${r.id})" style="background:none;border:none;color:#4A5450;padding:4px;font-size:16px;">✕</button>
        </div>
      </div>`;

    if (others.length > 0) {
      html += `<div class="sync-toggle" onclick="toggleExpanded(${r.id})" style="cursor:pointer;user-select:none;">
        <span>${isExpanded ? "▾" : "▸"}</span>
        <span>👥</span>
        ${isEnemy ? "Sync same-time or follow-up hit" : "Sync others to this hit"}
      </div>`;

      if (isExpanded) {
        html += `<div style="margin-top:8px;border-top:1px solid #1D2523;padding-top:8px;">
          <div class="sync-grid" style="grid-template-columns:${isEnemy ? "1fr 84px 84px" : "1fr 84px"};">`;
        if (isEnemy) {
          html += `<span></span>
            <span class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.04em;text-align:right;">SAME TIME</span>
            <span class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.04em;text-align:right;">FOLLOW-UP</span>`;
        }
        others.forEach(p => {
          const pMeta = TEAM_META[p.team];
          const late = p.secsUntilStart < -1;
          const startNow = p.secsUntilStart >= -1 && p.secsUntilStart <= 0;
          const followLate = p.secsUntilFollowStart < -1;
          const followStartNow = p.secsUntilFollowStart >= -1 && p.secsUntilFollowStart <= 0;
          html += `
            <div class="row" style="gap:6px;min-width:0;font-size:12.5px;">
              <span class="dot" style="background:${pMeta.accent};"></span>
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</span>
              <span class="mono" style="color:#5A6560;font-size:10.5px;white-space:nowrap;">(${p.marchTime}s)</span>
            </div>
            <div class="mono js-timer-sync" data-target-ts="${p.startBy}" style="font-size:12.5px;font-weight:700;text-align:right;color:${late ? "#E1594F" : startNow ? "#F2A93B" : "#8A948F"};">
              ${startNow ? "now" : fmtMMSS(p.secsUntilStart)}
            </div>`;
          if (isEnemy) {
            html += `<div class="mono js-timer-sync-follow" data-target-ts="${p.followStartBy}" style="font-size:12.5px;font-weight:700;text-align:right;color:${followLate ? "#E1594F" : followStartNow ? "#3FD6C7" : "#8A948F"};">
              ${followStartNow ? "now" : fmtMMSS(p.secsUntilFollowStart)}
            </div>`;
          }
        });
        html += `</div></div>`;
      }
    }
    html += `</div>`;
  });
  html += `</div></div>`;

  // ---- Sync Groups section ----
  const allyMembers = roster.filter(p => p.team === "ally");
  html += `<div style="padding:0 16px 8px;">
    <div class="row" style="justify-content:space-between;margin-bottom:10px;">
      <div class="row" style="gap:8px;">
        <span>🎯</span>
        <div class="display" style="font-size:15px;color:#3FD6C7;text-transform:uppercase;">Sync Groups</div>
      </div>
      <button class="btn pill" onclick="openGroupEditor(null)">+ New group</button>
    </div>
    <div class="mono" style="font-size:11px;color:#5A6560;margin-bottom:10px;">Plan a synced hit, then hit Launch to send everyone to Incoming with a start countdown.</div>
    <div style="display:flex;flex-direction:column;gap:10px;">`;

  if (groupEditor) {
    const isNew = groupEditor.id == null;
    html += `<div class="card" style="border-color:#2A3330;">
      <div class="mono" style="font-size:10px;color:#5A6560;letter-spacing:0.06em;margin-bottom:6px;">${isNew ? "NEW GROUP" : "EDIT GROUP"}</div>
      <input id="group-editor-name" class="field" placeholder="Group name (e.g. Alpha Strike)" value="${esc(groupEditor.name)}" oninput="onGroupNameInput(this)" style="width:100%;margin-bottom:10px;" />`;

    if (allyMembers.length === 0) {
      html += `<div style="font-size:12.5px;color:#4A5450;padding:6px 2px;">Add members to OUR STATE roster first.</div>`;
    } else {
      html += `<div class="mono" style="font-size:10px;color:#5A6560;letter-spacing:0.06em;margin-bottom:6px;">MEMBERS (${groupEditor.memberIds.length} selected)</div>
        <div style="display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;margin-bottom:10px;">`;
      allyMembers.forEach(p => {
        const checked = groupEditor.memberIds.includes(p.id);
        html += `<div class="row" style="gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;background:${checked ? "#152420" : "transparent"};" onclick="toggleGroupMember(${p.id})">
          <span style="font-size:14px;color:${checked ? "#3FD6C7" : "#4A5450"};">${checked ? "☑" : "☐"}</span>
          <span style="font-size:13px;flex:1;">${esc(p.name)}</span>
          <span class="mono" style="font-size:9.5px;color:#5A6560;">${esc(p.alliance)}</span>
          <span class="mono" style="font-size:10.5px;color:#6B7570;">${p.marchTime}s</span>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="row" style="gap:8px;justify-content:flex-end;">
        <button class="btn" onclick="cancelGroupEditor()" style="background:none;border:1px solid #2A3330;border-radius:6px;color:#8A948F;padding:6px 12px;font-size:12.5px;">Cancel</button>
        <button class="btn" onclick="saveGroup()" style="background:#3FD6C7;border:none;border-radius:6px;color:#0B0F0E;padding:6px 12px;font-size:12.5px;font-weight:600;">${isNew ? "Create group" : "Save"}</button>
      </div>
      ${groupEditor.memberIds.length < 2 ? `<div class="mono" style="font-size:10.5px;color:#5A6560;margin-top:6px;text-align:right;">Select at least 2 members</div>` : ""}
    </div>`;
  }

  if (groups.length === 0 && !groupEditor) {
    html += `<div style="padding:18px 14px;background:#121815;border:1px dashed #262E2B;border-radius:8px;color:#5A6560;font-size:13px;">No sync groups yet. Create one to plan a coordinated hit.</div>`;
  }

  groups.forEach(g => {
    const members = roster.filter(p => g.memberIds.includes(p.id));
    if (members.length < 2) return;
    const totals = members.map(p => ({ ...p, total: RALLY_BUFFER + p.marchTime }));
    const targetTs = g.mode === "target" ? parseUTCTimeToday(g.targetTime) : null;
    const canLaunch = g.mode === "now" || targetTs != null;
    const launchedCount = rallies.filter(r => r.groupId === g.id).length;

    html += `<div class="card" style="border-left:3px solid #3FD6C7;">
      <div class="row" style="justify-content:space-between;gap:10px;margin-bottom:8px;">
        <div>
          <div style="font-size:14px;font-weight:600;">${esc(g.name)}</div>
          <div class="mono" style="font-size:10.5px;color:#6B7570;">${members.length} members</div>
        </div>
        <div class="row" style="gap:6px;">
          <button class="btn" onclick="openGroupEditor(${g.id})" style="background:none;border:none;color:#4A5450;padding:4px;font-size:14px;">✎</button>
          <button class="btn" onclick="requestDelete('group',${g.id})" style="background:none;border:none;color:#4A5450;padding:4px;font-size:14px;">🗑</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
        <div class="row" style="gap:6px;">
          <button class="btn pill ${g.mode === "now" ? "active" : ""}" onclick="setGroupMode(${g.id},'now')" style="flex:1;">Start time</button>
          <button class="btn pill ${g.mode === "target" ? "active" : ""}" onclick="setGroupMode(${g.id},'target')" style="flex:1;">Target time</button>
        </div>
        <div class="row" style="gap:5px;">
          ${g.mode === "now" ? `
            <button class="btn pill ${((Number(g.launchDelay) || 0) === 0) ? "active" : ""}" onclick="setGroupPreset(${g.id},'now')" style="padding:3px 9px;font-size:10.5px;">now</button>
            <button class="btn pill ${Number(g.launchDelay) === 60 ? "active" : ""}" onclick="setGroupPreset(${g.id},'1m')" style="padding:3px 9px;font-size:10.5px;">1min</button>
            <button class="btn pill ${Number(g.launchDelay) === 300 ? "active" : ""}" onclick="setGroupPreset(${g.id},'5m')" style="padding:3px 9px;font-size:10.5px;">5min</button>
          ` : `
            <button class="btn pill" onclick="setGroupPreset(${g.id},'6m')" style="padding:3px 9px;font-size:10.5px;">+6min</button>
            <button class="btn pill" onclick="setGroupPreset(${g.id},'10m')" style="padding:3px 9px;font-size:10.5px;">+10min</button>
          `}
        </div>
      </div>
      <div class="row" style="gap:6px;margin-bottom:10px;">
        <div class="row" style="gap:6px;margin-left:auto;">
          ${launchedCount > 0 ? `<button class="btn pill" onclick="requestDelete('groupLaunch',${g.id})" style="background:none;border-color:#E1594F;color:#E1594F;">✕ Cancel launch (${launchedCount})</button>` : ""}
          <button class="btn pill" ${canLaunch ? `onclick="launchGroup(${g.id})"` : ""} style="background:#F2A93B;color:#0B0F0E;border-color:#F2A93B;${canLaunch ? "" : "opacity:0.4;cursor:default;"}">▶ Launch</button>
        </div>
      </div>`;

    if (g.mode === "target") {
      html += `<div class="row" style="gap:8px;margin-bottom:8px;">
        <span class="mono" style="font-size:11px;color:#8A948F;">Hit at (UTC)</span>
        <input id="group-target-${g.id}" class="field dark" placeholder="HH:MM or HH:MM:SS" value="${esc(g.targetTime)}" oninput="onGroupTargetInput(this,${g.id})" onkeydown="handleGroupTargetKey(event)" onblur="render()" style="width:130px;" />
      </div>`;

      if (targetTs == null) {
        html += `<div style="font-size:12px;color:#5A6560;">Enter a valid UTC time to calculate the start order.</div>`;
      } else {
        const rows = totals
          .map(p => ({ ...p, startAt: targetTs - p.total * 1000 }))
          .sort((a, b) => a.startAt - b.startAt);
        html += `<div class="mono" style="font-size:11px;color:#F2A93B;margin-bottom:8px;">🎯 Hits at UTC ${fmtClockUTC(new Date(targetTs))}</div>
          <div class="sync-grid" style="grid-template-columns:1fr 78px 84px;">
            <span></span>
            <span class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.04em;text-align:right;">START (UTC)</span>
            <span class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.04em;text-align:right;">STARTS IN</span>`;
        rows.forEach(p => {
          const secsUntil = (p.startAt - now) / 1000;
          const late = secsUntil < -1;
          const startNow = secsUntil >= -1 && secsUntil <= 0;
          html += `
            <div class="row" style="gap:6px;min-width:0;font-size:12.5px;">
              <span class="dot" style="background:#3FD6C7;"></span>
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</span>
              <span class="mono" style="color:#5A6560;font-size:10.5px;white-space:nowrap;">(${p.marchTime}s)</span>
            </div>
            <div class="mono" style="font-size:11.5px;text-align:right;color:#6B7570;">${fmtClockUTC(new Date(p.startAt))}</div>
            <div class="mono js-timer-group-start" data-target-ts="${p.startAt}" style="font-size:12.5px;font-weight:700;text-align:right;color:${late ? "#E1594F" : startNow ? "#F2A93B" : "#8A948F"};">
              ${startNow ? "now" : fmtMMSS(secsUntil)}
            </div>`;
        });
        html += `</div>`;
      }
    } else {
      const maxTotal = Math.max(...totals.map(p => p.total));
      const etaTs = now + ((Number(g.launchDelay) || 0) + maxTotal) * 1000;
      const launchDelay = Number(g.launchDelay) || 0;
      const rows = totals
        .map(p => ({ ...p, delay: launchDelay + maxTotal - p.total }))
        .sort((a, b) => a.delay - b.delay);
      html += `<div class="mono js-group-eta" data-launch-delay="${launchDelay}" data-max-total="${maxTotal}" style="font-size:11px;color:#F2A93B;margin-bottom:8px;">🎯 ≈ hits UTC ${fmtClockUTC(new Date(etaTs))} if launched now</div>
        <div class="sync-grid" style="grid-template-columns:1fr 84px;">
          <span></span>
          <span class="mono" style="font-size:9px;color:#5A6560;letter-spacing:0.04em;text-align:right;">LAUNCH ORDER</span>`;
      rows.forEach(p => {
        html += `
          <div class="row" style="gap:6px;min-width:0;font-size:12.5px;">
            <span class="dot" style="background:#3FD6C7;"></span>
            <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</span>
            <span class="mono" style="color:#5A6560;font-size:10.5px;white-space:nowrap;">(${p.marchTime}s)</span>
          </div>
          <div class="mono" style="font-size:12.5px;font-weight:700;text-align:right;color:${p.delay <= 0 ? "#F2A93B" : "#8A948F"};">
            ${p.delay <= 0 ? "start now" : "+" + fmtMMSS(p.delay)}
          </div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;
  });

  html += `</div></div>`;

  ["ally", "enemy"].forEach(team => {
    const meta = TEAM_META[team];
    const members = roster.filter(p => p.team === team);
    const alliances = [...new Set(members.map(p => p.alliance || "Unassigned"))].sort((a, b) => {
      if (a === "Unassigned") return 1;
      if (b === "Unassigned") return -1;
      return a.localeCompare(b);
    });

    html += `<div style="padding:8px 16px 20px;">
      <div class="row" style="gap:8px;margin-bottom:10px;margin-top:8px;">
        <span>${meta.icon}</span>
        <div class="display" style="font-size:15px;color:${meta.accent};text-transform:uppercase;">${meta.label}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px;">`;

    if (members.length === 0) {
      html += `<div style="font-size:12.5px;color:#4A5450;padding:4px 2px;">No one added yet.</div>`;
    }

    alliances.forEach(alliance => {
      const allianceMembers = members
        .filter(p => (p.alliance || "Unassigned") === alliance)
        .sort((a, b) => b.marchTime - a.marchTime);

      html += `<div>
        <div class="row" style="gap:6px;margin-bottom:6px;padding:4px 2px;">
          <span style="font-size:12px;">🏳️</span>
          <div class="display" style="font-size:11px;color:#8A948F;text-transform:uppercase;">${esc(alliance)}</div>
          <span class="mono" style="font-size:9px;color:#4A5450;">${allianceMembers.length}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">`;

      allianceMembers.forEach(p => {
        if (editDraft && editDraft.id === p.id) {
          html += `<div class="card" style="padding:9px 12px;">
            <div class="row" style="gap:6px;margin-bottom:6px;">
              <input id="edit-name" class="field dark" value="${esc(editDraft.name)}" oninput="onEditInput(this,'name')" onkeydown="handleEditKey(event)" style="flex:1;" />
              <input id="edit-alliance" class="field dark" placeholder="Alliance" value="${esc(editDraft.alliance)}" oninput="onEditInput(this,'alliance')" onkeydown="handleEditKey(event)" style="width:90px;" />
              <input id="edit-march" class="field dark" placeholder="secs" value="${esc(editDraft.march)}" oninput="onEditInput(this,'march')" onkeydown="handleEditKey(event)" style="width:64px;" />
            </div>
            <div class="row" style="gap:6px;justify-content:flex-end;">
              <button class="btn" onclick="cancelEdit()" style="background:none;border:1px solid #2A3330;border-radius:6px;color:#8A948F;padding:5px 10px;font-size:12px;">Cancel</button>
              <button class="btn" onclick="saveEdit()" style="background:${meta.accent};border:none;border-radius:6px;color:#0B0F0E;padding:5px 10px;font-size:12px;font-weight:600;">Save</button>
            </div>
          </div>`;
        } else {
          html += `<div class="row card" style="justify-content:space-between;padding:9px 12px;">
            <div>
              <div style="font-size:13.5px;font-weight:500;">${esc(p.name)}</div>
              <div class="mono" style="font-size:11px;color:#6B7570;">march ${p.marchTime}s</div>
            </div>
            <div class="row" style="gap:6px;">
              <button class="btn row" onclick="startRally(${p.id})" style="gap:5px;background:${meta.accent};color:#0B0F0E;border:none;border-radius:6px;padding:6px 10px;font-size:12.5px;font-weight:600;">▶ Start</button>
              <button class="btn" onclick="startEdit(${p.id})" style="background:none;border:none;color:#4A5450;padding:4px;font-size:14px;">✎</button>
              <button class="btn" onclick="requestDelete('person',${p.id})" style="background:none;border:none;color:#4A5450;padding:4px;font-size:14px;">🗑</button>
            </div>
          </div>`;
        }
      });

      html += `</div></div>`;
    });

    html += `</div>
      <div class="row" style="gap:6px;">
        <input id="name-${team}" class="field" placeholder="Name" value="${esc(draft[team].name)}" oninput="onDraftInput(this,'${team}','name')" onkeydown="handleEnter(event,'${team}')" style="flex:1;" />
        <input id="alliance-${team}" class="field" placeholder="Alliance" value="${esc(draft[team].alliance)}" oninput="onDraftInput(this,'${team}','alliance')" onkeydown="handleEnter(event,'${team}')" style="width:105px;" />
        <input id="march-${team}" class="field" placeholder="secs / mm:ss" inputmode="text" value="${esc(draft[team].march)}" oninput="onDraftInput(this,'${team}','march')" onkeydown="handleEnter(event,'${team}')" style="width:88px;" />
        <button class="btn" onclick="addPerson('${team}')" style="background:#1D2523;border:1px solid #2A3330;border-radius:6px;padding:8px 10px;color:${meta.accent};font-size:16px;">+</button>
      </div>
    </div>`;
  });

  if (pendingDelete) {
    html += `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;">
      <div class="card" style="max-width:320px;width:100%;padding:18px;">
        <div style="font-size:14px;color:#E8ECE9;margin-bottom:14px;">Remove ${esc(pendingDelete.label)}?</div>
        <div class="row" style="gap:8px;justify-content:flex-end;">
          <button class="btn" onclick="cancelDelete()" style="background:none;border:1px solid #2A3330;border-radius:6px;color:#8A948F;padding:6px 12px;font-size:13px;">Cancel</button>
          <button class="btn" onclick="confirmDelete()" style="background:#E1594F;border:none;border-radius:6px;color:#0B0F0E;padding:6px 12px;font-size:13px;font-weight:600;">Remove</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById("root").innerHTML = html;
}

// ---- targeted fast timer updates ----
function tickTimers() {
  const now = Date.now();
  let needsReRender = false;

  for (let r of rallies) {
    if (now - r.hitTime >= 2 * 60 * 1000) {
      needsReRender = true;
      break;
    }
    if (r._wasScheduled && now >= r.startAt) {
      needsReRender = true;
      break;
    }
  }

  if (needsReRender) {
    render();
    return;
  }

  document.querySelectorAll(".js-rally-card").forEach(card => {
    const isScheduled = card.dataset.isScheduled === "true";
    const startAt = Number(card.dataset.startAt);
    const hitTime = Number(card.dataset.hitTime);

    const hitRemaining = (hitTime - now) / 1000;
    const hasHit = hitRemaining <= 0;
    const secsUntilStart = isScheduled ? (startAt - now) / 1000 : 0;

    const imminent = !isScheduled && !hasHit && hitRemaining <= 10;
    const imminentStart = isScheduled && secsUntilStart <= 10;

    card.classList.toggle("imminent", imminent);
    card.classList.toggle("imminent-start", imminentStart);
    const borderCol = hasHit ? "#E1594F" : "#1D2523";
    card.style.borderTopColor = borderCol;
    card.style.borderRightColor = borderCol;
    card.style.borderBottomColor = borderCol;

    const startsInEl = card.querySelector(".js-timer-starts-in");
    if (startsInEl) {
      startsInEl.textContent = fmtMMSS(secsUntilStart);
    }

    const rallyEl = card.querySelector(".js-timer-rally");
    if (rallyEl) {
      const elapsed = (now - startAt) / 1000;
      const rallyRemaining = RALLY_BUFFER - elapsed;
      const rallyDone = rallyRemaining <= 0;
      rallyEl.textContent = rallyDone ? "0:00" : fmtMMSS(rallyRemaining);
      rallyEl.style.color = rallyDone ? "#3E4A46" : "#8A948F";
    }

    const hitEl = card.querySelector(".js-timer-hit");
    if (hitEl) {
      hitEl.textContent = hasHit ? "HIT" : fmtMMSS(hitRemaining);
      hitEl.style.color = hasHit ? "#E1594F" : "#F2A93B";
    }
  });

  document.querySelectorAll(".js-timer-sync").forEach(el => {
    const targetTs = Number(el.dataset.targetTs);
    const secs = (targetTs - now) / 1000;
    const late = secs < -1;
    const startNow = secs >= -1 && secs <= 0;
    el.textContent = startNow ? "now" : fmtMMSS(secs);
    el.style.color = late ? "#E1594F" : startNow ? "#F2A93B" : "#8A948F";
  });

  document.querySelectorAll(".js-timer-sync-follow").forEach(el => {
    const targetTs = Number(el.dataset.targetTs);
    const secs = (targetTs - now) / 1000;
    const followLate = secs < -1;
    const followStartNow = secs >= -1 && secs <= 0;
    el.textContent = followStartNow ? "now" : fmtMMSS(secs);
    el.style.color = followLate ? "#E1594F" : followStartNow ? "#3FD6C7" : "#8A948F";
  });

  document.querySelectorAll(".js-timer-group-start").forEach(el => {
    const targetTs = Number(el.dataset.targetTs);
    const secs = (targetTs - now) / 1000;
    const late = secs < -1;
    const startNow = secs >= -1 && secs <= 0;
    el.textContent = startNow ? "now" : fmtMMSS(secs);
    el.style.color = late ? "#E1594F" : startNow ? "#F2A93B" : "#8A948F";
  });

  document.querySelectorAll(".js-group-eta").forEach(el => {
    const launchDelay = Number(el.dataset.launchDelay) || 0;
    const maxTotal = Number(el.dataset.maxTotal) || 0;
    const etaTs = now + (launchDelay + maxTotal) * 1000;
    el.textContent = `🎯 ≈ hits UTC ${fmtClockUTC(new Date(etaTs))} if launched now`;
  });
}

render();
setInterval(tickTimers, 1000);
</script>
</body>
</html>
